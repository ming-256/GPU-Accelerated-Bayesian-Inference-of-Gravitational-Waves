################################################################################
## Parallel Bilby: GW150914 — IMRPhenomD
##
## Matched to our JAX analysis (GW150914/Scripts/GW150914_heterodyned.py):
##   - Waveform: IMRPhenomD (aligned spin, (2,2)-only)
##   - Duration: 8s
##   - f_min: 20 Hz, f_max: 1024 Hz, f_ref: 20 Hz
##   - Priors: M_c [10, 80], q [0.125, 1], spins [-1, 1], d_L [1, 2000] Mpc
##   - Component masses: [1, 100] M_sun
##   - PSD: Welch estimated (32s Tukey segments, median averaging)
################################################################################

################################################################################
## Data generation arguments
################################################################################

trigger-time = 1126259462.4

################################################################################
## Detector arguments
################################################################################

detectors = [H1, L1]
channel-dict = {H1:GWOSC, L1:GWOSC}
duration = 8
post-trigger-duration = 2
maximum-frequency = 1024
minimum-frequency = 20
tukey-roll-off = 0.4
psd-length = 32
psd-fractional-overlap = 0.5
psd-method = median

################################################################################
## Job submission arguments
################################################################################

label = GW150914_IMRPhenomD
outdir = ../results/GW150914_IMRPhenomD

################################################################################
## Likelihood arguments
################################################################################

distance-marginalization = False
phase-marginalization = True
time-marginalization = False
jitter-time = False
reference-frame = H1L1
time-reference = geocent
likelihood-type = RelativeBinningGravitationalWaveTransient
epsilon = 0.5

################################################################################
## Prior arguments
################################################################################

prior-file = GW150914_IMRPhenomD.prior

################################################################################
## Waveform arguments
################################################################################

waveform-approximant = IMRPhenomD
frequency-domain-source-model = lal_binary_black_hole
reference-frequency = 20.0

################################################################################
## Sampler settings
################################################################################

sampler = pypolychord
nlive = 2000
nprior = -1
num-repeats = 40

################################################################################
## Slurm Settings
################################################################################

nodes = 4
ntasks-per-node = 16
time = 24:00:00
n-check-point = 10000
