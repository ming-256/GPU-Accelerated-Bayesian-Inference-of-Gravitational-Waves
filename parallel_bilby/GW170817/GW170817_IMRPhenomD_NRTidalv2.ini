################################################################################
## Parallel Bilby: GW170817 — IMRPhenomD_NRTidalv2
##
## Matched to our JAX analysis (GW170817/Scripts/GW170817_heterodyned_1.py):
##   - Waveform: IMRPhenomD_NRTidalv2 (aligned spin + tidal, BNS)
##   - Duration: 128s
##   - f_min: 23 Hz, f_max: 2048 Hz, f_ref: 20 Hz
##   - Priors: M_c [1.184, 2.168], q [0.125, 1], spins [-0.05, 0.05]
##   - d_L [1, 75] Mpc, lambda_1/lambda_2 [0, 5000]
##   - Component masses: [0.5, 7.7] M_sun
##   - 3 detectors: H1, L1, V1
##   - PSD: Welch estimated (32s Tukey segments, median averaging)
################################################################################

################################################################################
## Data generation arguments
################################################################################

trigger-time = 1187008882.43

################################################################################
## Detector arguments
################################################################################

detectors = [H1, L1, V1]
channel-dict = {H1:GWOSC, L1:GWOSC, V1:GWOSC}
duration = 128
post-trigger-duration = 2
maximum-frequency = 2048
minimum-frequency = 23
tukey-roll-off = 0.4
psd-length = 32
psd-fractional-overlap = 0.5
psd-method = median

################################################################################
## Job submission arguments
################################################################################

label = GW170817_IMRPhenomD_NRTidalv2
outdir = ../results/GW170817_IMRPhenomD_NRTidalv2

################################################################################
## Likelihood arguments
################################################################################

distance-marginalization = False
phase-marginalization = True
time-marginalization = False
jitter-time = False
reference-frame = H1L1
time-reference = geocent
likelihood-type = RelativeBinningGravitationalWaveTransient
epsilon = 0.5

################################################################################
## Prior arguments
################################################################################

prior-file = GW170817.prior
enforce-signal-duration = False

################################################################################
## Waveform arguments
################################################################################

waveform-approximant = IMRPhenomD_NRTidalv2
frequency-domain-source-model = lal_binary_neutron_star
reference-frequency = 20.0

################################################################################
## Sampler settings
################################################################################

sampler = pypolychord
nlive = 2000
nprior = -1
num-repeats = 40

################################################################################
## Slurm Settings
################################################################################

nodes = 10
ntasks-per-node = 16
time = 48:00:00
n-check-point = 10000
